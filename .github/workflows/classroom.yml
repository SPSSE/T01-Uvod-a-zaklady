name: GitHub Classroom Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalace závislostí
        run: pip install -r requirements.txt

      - name: Úkol 1 - základní testy
        id: ukol-1-zaklad
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'Úkol 1 - základní testy'
          command: pytest cviceni/test_ukol_1.py -q
          timeout: 10
          max-score: 10

      - name: Úkol 2 - základní testy
        id: ukol-2-zaklad
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'Úkol 2 - základní testy'
          command: pytest cviceni/test_ukol_2.py -q
          timeout: 10
          max-score: 10

      - name: Úkol 3 - základní testy
        id: ukol-3-zaklad
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'Úkol 3 - základní testy'
          command: pytest cviceni/test_ukol_3.py -q
          timeout: 10
          max-score: 10

      - name: Úkol 1 - stress test (10000 náhodných vstupů)
        id: ukol-1-stress
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'Úkol 1 - stress test (10000 náhodných vstupů)'
          command: pytest cviceni/test_ukol_1_stress.py -q
          timeout: 10
          max-score: 15

      - name: Úkol 2 - stress test (10000 náhodných vstupů)
        id: ukol-2-stress
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'Úkol 2 - stress test (10000 náhodných vstupů)'
          command: pytest cviceni/test_ukol_2_stress.py -q
          timeout: 10
          max-score: 15

      - name: Úkol 3 - stress test (10000 náhodných vstupů)
        id: ukol-3-stress
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'Úkol 3 - stress test (10000 náhodných vstupů)'
          command: pytest cviceni/test_ukol_3_stress.py -q
          timeout: 10
          max-score: 15

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          UKOL-1-ZAKLAD_RESULTS: "${{steps.ukol-1-zaklad.outputs.result}}"
          UKOL-2-ZAKLAD_RESULTS: "${{steps.ukol-2-zaklad.outputs.result}}"
          UKOL-3-ZAKLAD_RESULTS: "${{steps.ukol-3-zaklad.outputs.result}}"
          UKOL-1-STRESS_RESULTS: "${{steps.ukol-1-stress.outputs.result}}"
          UKOL-2-STRESS_RESULTS: "${{steps.ukol-2-stress.outputs.result}}"
          UKOL-3-STRESS_RESULTS: "${{steps.ukol-3-stress.outputs.result}}"
        with:
          runners: ukol-1-zaklad,ukol-2-zaklad,ukol-3-zaklad,ukol-1-stress,ukol-2-stress,ukol-3-stress
